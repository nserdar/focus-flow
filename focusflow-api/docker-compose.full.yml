version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: focusflow-postgres
    environment:
      POSTGRES_DB: focusflow_db
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: focusflow
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - focusflow-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focusflow-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/focusflow_db
      SPRING_DATASOURCE_USERNAME: focusflow
      SPRING_DATASOURCE_PASSWORD: focusflow
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - focusflow-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: focusflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@focusflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - focusflow-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  focusflow-network:
    driver: bridge

