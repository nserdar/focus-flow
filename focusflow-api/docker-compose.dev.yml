version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: focusflow-postgres-dev
    environment:
      POSTGRES_DB: focusflow_db
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: focusflow
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local

